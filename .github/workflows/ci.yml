name: Verify site

# Runs the pre-deploy invariant checks (tools/verify_site.py) on pull requests
# and on pushes to main. To make this a merge gate, enable branch protection on
# `main` and mark "Verify site / verify" as a required status check.
on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify site invariants
        run: python3 tools/verify_site.py
