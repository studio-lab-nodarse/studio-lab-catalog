# Builds the site with Eleventy and deploys the generated _site/ to GitHub Pages.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
        # Trial-page values (repo Variables). Empty = that block is hidden.
        env:
          PROOF_STORES: ${{ vars.PROOF_STORES }}
          PROOF_UNITS_SOLD: ${{ vars.PROOF_UNITS_SOLD }}
          PROOF_REORDER_RATE: ${{ vars.PROOF_REORDER_RATE }}
          PROOF_YEARS: ${{ vars.PROOF_YEARS }}
          PROOF_SHOPS: ${{ vars.PROOF_SHOPS }}
          PROOF_QUOTE: ${{ vars.PROOF_QUOTE }}
          PROOF_QUOTE_ES: ${{ vars.PROOF_QUOTE_ES }}
          PROOF_QUOTE_BY: ${{ vars.PROOF_QUOTE_BY }}
          PRICE_MAGNET_RETAIL: ${{ vars.PRICE_MAGNET_RETAIL }}
          PRICE_STICKER_RETAIL: ${{ vars.PRICE_STICKER_RETAIL }}
          PRICE_CAP_RETAIL: ${{ vars.PRICE_CAP_RETAIL }}
          PRICE_TOTE_RETAIL: ${{ vars.PRICE_TOTE_RETAIL }}
          PRICE_COASTER_RETAIL: ${{ vars.PRICE_COASTER_RETAIL }}
          MARGIN_FLOOR_PCT: ${{ vars.MARGIN_FLOOR_PCT }}
          MARGIN_TOP_PCT: ${{ vars.MARGIN_TOP_PCT }}
          BOX_MAGNETS: ${{ vars.BOX_MAGNETS }}
          BOX_STICKERS: ${{ vars.BOX_STICKERS }}
          BOX_COASTERS: ${{ vars.BOX_COASTERS }}
          BOX_CAPS: ${{ vars.BOX_CAPS }}
          BOX_TOTES: ${{ vars.BOX_TOTES }}
          BOX_VALUE_RETAIL: ${{ vars.BOX_VALUE_RETAIL }}
          TRIAL_REPLY_DAYS: ${{ vars.TRIAL_REPLY_DAYS }}
          TRIAL_SHIP_DAYS: ${{ vars.TRIAL_SHIP_DAYS }}
          REORDER_DAYS: ${{ vars.REORDER_DAYS }}
          TRIAL_REORDER_MIN: ${{ vars.TRIAL_REORDER_MIN }}
          CUSTOM_MIN: ${{ vars.CUSTOM_MIN }}
          CUSTOM_LEAD_DAYS: ${{ vars.CUSTOM_LEAD_DAYS }}
          TRIAL_ZIP_MIN: ${{ vars.TRIAL_ZIP_MIN }}
          TRIAL_ZIP_MAX: ${{ vars.TRIAL_ZIP_MAX }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      - name: Verify site invariants
        # Same gate as CI, run against the built output — a bad build never ships.
        run: python3 tools/verify_site.py _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the generated site. deprecated/ and src/ are never copied into
          # _site, so no separate strip step is needed.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
