<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Página no encontrada · Studio Lab</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0b0c; color: #f4f4f5; padding: 24px; text-align: center;
    }
    @media (prefers-color-scheme: light) {
      body { background: #fafafa; color: #18181b; }
      .btn { background: #fff; border-color: #e4e4e7; }
    }
    .code { font-size: 4rem; font-weight: 800; letter-spacing: -.04em; margin: 0; opacity: .9; }
    h1 { font-size: 1.25rem; margin: 8px 0 4px; }
    p { margin: 0 0 24px; opacity: .65; }
    .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      text-decoration: none; color: inherit;
      padding: 12px 20px; border-radius: 12px;
      background: #161618; border: 1px solid #27272a;
      transition: border-color .15s ease, transform .15s ease;
    }
    .btn:hover { border-color: #6366f1; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <h1>Página no encontrada · Page not found</h1>
    <p>Esta página no existe o fue movida. / This page doesn't exist or was moved.</p>
    <div class="btns">
      <a class="btn" href="/studio-lab-catalog/apps/storefront/">Miami Peculiar</a>
    </div>
  </div>
</body>
</html>
