<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Lab</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0b0c; color: #f4f4f5;
      padding: 24px;
    }
    @media (prefers-color-scheme: light) {
      body { background: #fafafa; color: #18181b; }
      .card { background: #fff; border-color: #e4e4e7; }
      .card p { color: #52525b; }
    }
    .wrap { width: 100%; max-width: 640px; text-align: center; }
    h1 { font-size: 1.75rem; margin: 0 0 4px; letter-spacing: -.02em; }
    .sub { opacity: .6; margin: 0 0 32px; }
    .grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
    .card {
      display: block; text-decoration: none; color: inherit;
      padding: 28px 24px; border-radius: 16px;
      background: #161618; border: 1px solid #27272a;
      transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #6366f1; }
    .card h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .card p { margin: 0; font-size: .9rem; opacity: .7; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Studio Lab</h1>
    <p class="sub">Elige una app</p>
    <div class="grid">
      <a class="card" href="apps/catalog/index.html">
        <h2>Catálogo 2026</h2>
        <p>Catálogo completo con carrito</p>
      </a>
      <a class="card" href="apps/storefront/index.html">
        <h2>Miami Peculiar</h2>
        <p>Tienda: gorras, magnets, stickers y colecciones</p>
      </a>
    </div>
  </div>
</body>
</html>
